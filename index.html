<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0c0e14" />
    <title>Lira - Espaço Virtual e Comunicação</title>
    <!-- Google Fonts for modern clean typography and pixel aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Loaded as "print" and switched to "all" once it arrives, so this stylesheet blocks neither the
         first paint nor the app script. Offline, the app just starts with the system font. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Press+Start+2P&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Press+Start+2P&display=swap"></noscript>
    <!-- Splash: plain CSS written here, so it is painted as soon as the page arrives. -->
    <style>
      html, body { margin: 0; background: #0c0e14; }
      #boot-splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #0c0e14; color: #94a3b8;
        font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.02em;
      }
      #boot-splash svg { width: 84px; height: 84px; }
      #boot-splash .boot-spinner {
        width: 26px; height: 26px; border-radius: 50%;
        border: 3px solid rgba(129, 140, 248, 0.22); border-top-color: #818cf8;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot-splash .boot-spinner { animation-duration: 2.4s; } }
    </style>
  </head>
  <body class="bg-[#0c0e14] text-slate-100 antialiased select-none overflow-hidden h-screen w-screen">
    <div id="root" class="h-full w-full">
      <div id="boot-splash">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
            <line x1="28" y1="28" x2="72" y2="28" stroke-width="6" />
            <circle cx="28" cy="28" r="3.5" fill="#ffffff" stroke="none" />
            <circle cx="72" cy="28" r="3.5" fill="#ffffff" stroke="none" />
            <path d="M 31 28 C 21 28 16 17 24 13 C 30 10 36 17 31 28 C 23 45 22 61 40 73" stroke-width="5.5" fill="none" />
            <path d="M 69 28 C 79 28 84 17 76 13 C 70 10 64 17 69 28 C 77 45 78 61 60 73" stroke-width="5.5" fill="none" />
            <path d="M 37 72 L 63 72 L 68 85 L 32 85 Z" stroke-width="4" fill="#ffffff" fill-opacity="0.25" />
            <line x1="30" y1="85" x2="70" y2="85" stroke-width="5" />
          </g>
          <g stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" opacity="0.95">
            <line x1="39" y1="29" x2="39" y2="72" />
            <line x1="46" y1="29" x2="46" y2="72" />
            <line x1="54" y1="29" x2="54" y2="72" />
            <line x1="61" y1="29" x2="61" y2="72" />
          </g>
        </svg>
        <div class="boot-spinner" aria-hidden="true"></div>
        <div id="boot-splash-status" role="status">Abrindo o Lira…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
