# Discovery-only fallback for Lira. Deploy on Linux with public UDP 3478.
# TURN allocation is disabled: anonymous STUN cannot become an open relay.
listening-port=3478
stun-only
no-auth
no-tcp
no-tls
# Coturn 4.18 removed DTLS and the CLI; RFC5780 is disabled by default.
fingerprint
log-file=stdout
simple-log
