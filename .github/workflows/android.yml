name: Android APK Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach the APK to (e.g. v1.1.82). Empty = latest release.'
        required: false
        default: ''
  # Called by release.yml right after the Windows release exists, because a release created
  # with GITHUB_TOKEN does not trigger other workflows on its own.
  workflow_call:
    inputs:
      tag_name:
        type: string
        required: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --json tagName -q .tagName)
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Lira release tag: $TAG" >&2
            exit 1
          fi
          git checkout --detach "refs/tags/$TAG"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Calculate monotonic numeric versionCode: e.g. 1.1.98 -> 101098
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          VERSION_CODE=$(( (MAJOR * 100000) + (MINOR * 1000) + PATCH ))
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Configure local Java and Android SDK
        run: |
          java -version
          SDK_DIR="$ANDROID_HOME"
          if [ -z "$SDK_DIR" ]; then SDK_DIR="$ANDROID_SDK_ROOT"; fi
          if [ -z "$SDK_DIR" ] && [ -n "$LOCALAPPDATA" ]; then SDK_DIR="$LOCALAPPDATA/Android/Sdk"; fi
          if [ ! -d "$SDK_DIR/platforms/android-35" ]; then
            echo "Android SDK platform android-35 not found in: $SDK_DIR" >&2
            exit 1
          fi
          if command -v cygpath >/dev/null 2>&1; then
            SDK_DIR=$(cygpath -w "$SDK_DIR")
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci

      - name: Build web bundle
        env:
          LIRA_TARGET: web
          VITE_APP_VERSION: ${{ steps.tag.outputs.version }}
          LIRA_VERSION_NAME: ${{ steps.tag.outputs.version }}
          VITE_TURN_URLS: ${{ secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
          VITE_TURN_CREDENTIALS_URL: ${{ secrets.VITE_TURN_CREDENTIALS_URL }}
        run: npx tsc && npx vite build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Restore Keystore from Secret (if present)
        working-directory: android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring lira-release.jks from GitHub secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > lira-release.jks
          fi

      - name: Build APK
        working-directory: android
        env:
          LIRA_VERSION_NAME: ${{ steps.tag.outputs.version }}
          LIRA_VERSION_CODE: ${{ steps.tag.outputs.version_code }}
        run: |
          if [ -f "./gradlew.bat" ]; then
            cmd.exe //c "gradlew.bat assembleRelease --no-daemon"
          else
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon
          fi
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "../Lira-${{ steps.tag.outputs.tag_name }}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "../Lira-${{ steps.tag.outputs.tag_name }}.apk"
          fi

      - name: Upload APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.tag_name }}" "Lira-${{ steps.tag.outputs.tag_name }}.apk" --clobber
