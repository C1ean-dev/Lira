name: CI/CD Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Version allocation and both platform uploads share one release tag namespace.
concurrency:
  group: lira-release-publication
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and Release Windows App
    runs-on: windows-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test -- --maxWorkers=2 --testTimeout=60000 --hookTimeout=60000

      - name: Install browser for core call tests
        run: npx playwright install chromium

      - name: Verify calls and screen sharing before packaging
        run: npm run test:core:browser

      - name: Generate Dynamic Version Tag and Bump package.json
        id: tag
        shell: bash
        run: |
          git fetch origin --tags
          node scripts/bump-version.js

      - name: Build and Package Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          VITE_TURN_URLS: ${{ secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
          VITE_TURN_CREDENTIALS_URL: ${{ secrets.VITE_TURN_CREDENTIALS_URL }}
        run: npm run build

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.release_title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Android APK
    needs: build-and-release
    uses: ./.github/workflows/android.yml
    with:
      tag_name: ${{ needs.build-and-release.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: write

  prune-releases:
    name: Prune Old Releases
    needs: [build-and-release, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Prune old GitHub releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_RELEASE_TAG: ${{ needs.build-and-release.outputs.tag_name }}
        run: node scripts/prune-releases.mjs
